name: Verify ScannerAz API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan tracked source for known malware signatures
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clamav
          # Ubuntu starts the freshclam daemon during package installation.
          # Stop it before the one-shot update so it cannot retain the log lock.
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --stdout --log=/tmp/freshclam.log
          git ls-files -z | xargs -0 -r clamscan --no-summary --infected --
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run test:auth
      - run: npm run build
